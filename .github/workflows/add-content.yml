name: Generate Portfolio Content

on:
  workflow_dispatch:  # Manual trigger via GitHub UI
  push:
    branches:
      - main

jobs:
  generate-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create portfolio structure
        run: |
          # Create directories
          mkdir -p public
          mkdir -p src
          mkdir -p assets/images
          mkdir -p data

      - name: Create README
        run: |
          cat > README.md << 'EOF'
          # Vlad-Teodor Georgescu
          
          **Point Guard / Playmaker | Free Agent**
          
          📍 Brașov, România
          📧 vladgeorgescu123@gmail.com
          📱 +40 757 330 375
          
          ## Stats
          - **Height**: 186 cm
          - **Weight**: 78 kg
          - **DOB**: 12.07.2000
          - **Nationality**: Romania (EU)
          
          ## Current Season (2025-26)
          - **Club**: CSU SCM Brașov, Liga I
          - **PPG**: 22.2
          - **RPG**: 8.3
          - **APG**: 6.0
          - **SPG**: 1.6
          
          ## Honors
          - 3× All-Romanian Liga I selection (2020, 2023, 2026)
          
          ## Career Highlights
          - Quick & fast
          - Defensive ability
          - Court communication
          - Work ethic
          - Playmaker / dynamic guard
          
          ## Languages
          - Romanian (Native)
          - English
          
          **Represented by Heinrich Sports Management (Austria)**
          FIBA Agent Licence: 2016504733
          EOF

      - name: Create career history JSON
        run: |
          cat > data/career.json << 'EOF'
          {
            "player": {
              "name": "Vlad-Teodor Georgescu",
              "position": "Point Guard / Playmaker",
              "height_cm": 186,
              "weight_kg": 78,
              "birthDate": "2000-07-12",
              "nationality": "Romania",
              "email": "vladgeorgescu123@gmail.com",
              "phone": "+40 757 330 375"
            },
            "careerHistory": [
              {
                "season": "2025-26",
                "club": "CSU SCM Brașov",
                "league": "Liga I",
                "note": "Most recent club. All-Liga I selection.",
                "stats": {
                  "PPG": 22.2,
                  "RPG": 8.3,
                  "APG": 6.0,
                  "SPG": 1.6
                }
              },
              {
                "season": "2024-25",
                "club": "CSM 2007 Focșani",
                "league": "Liga I",
                "note": "Joined a team recently relegated, to help it return to the top flight."
              },
              {
                "season": "2023-24",
                "club": "CSM Corona Brașov",
                "league": "Liga I",
                "note": "First professional contract."
              },
              {
                "season": "2019-23",
                "club": "BC CSU Sibiu",
                "league": "Liga I",
                "note": "First steps at pro level"
              }
            ],
            "skills": [
              "Quick & fast",
              "Defensive ability",
              "Court communication",
              "Work ethic",
              "Playmaker / dynamic guard"
            ],
            "honors": [
              "3× All-Romanian Liga I selection (2020, 2023, 2026)"
            ],
            "languages": ["Romanian - Native", "English"],
            "representation": {
              "agency": "Heinrich Sports Management",
              "country": "Austria",
              "fibaLicense": "2016504733"
            }
          }
          EOF

      - name: Create HTML portfolio page
        run: |
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Vlad Georgescu - Basketball Player</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background: #f4f4f4; }
                  .container { max-width: 900px; margin: 0 auto; padding: 20px; background: white; }
                  header { border-bottom: 3px solid #1e3a8a; padding: 20px 0; margin-bottom: 30px; }
                  h1 { font-size: 2.5em; color: #1e3a8a; }
                  .subtitle { font-size: 1.2em; color: #666; margin: 5px 0; }
                  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
                  .stat-box { background: #1e3a8a; color: white; padding: 15px; border-radius: 5px; }
                  .stat-label { font-size: 0.9em; opacity: 0.9; }
                  .stat-value { font-size: 1.8em; font-weight: bold; }
                  section { margin: 30px 0; }
                  h2 { color: #1e3a8a; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; }
                  ul { margin-left: 20px; }
                  li { margin: 8px 0; }
              </style>
          </head>
          <body>
              <div class="container">
                  <header>
                      <h1>Vlad-Teodor Georgescu</h1>
                      <p class="subtitle">Point Guard / Playmaker | Free Agent</p>
                      <p>📍 Brașov, România</p>
                  </header>
                  
                  <section class="stats">
                      <div class="stat-box">
                          <div class="stat-label">Height</div>
                          <div class="stat-value">186 cm</div>
                      </div>
                      <div class="stat-box">
                          <div class="stat-label">Weight</div>
                          <div class="stat-value">78 kg</div>
                      </div>
                      <div class="stat-box">
                          <div class="stat-label">Born</div>
                          <div class="stat-value">12.07.2000</div>
                      </div>
                      <div class="stat-box">
                          <div class="stat-label">PPG</div>
                          <div class="stat-value">22.2</div>
                      </div>
                  </section>
                  
                  <section>
                      <h2>Current Season (2025-26)</h2>
                      <p><strong>Club:</strong> CSU SCM Brașov, Liga I</p>
                      <p><strong>Status:</strong> All-Liga I selection</p>
                  </section>
                  
                  <section>
                      <h2>Skills</h2>
                      <ul>
                          <li>Quick & fast</li>
                          <li>Defensive ability</li>
                          <li>Court communication</li>
                          <li>Work ethic</li>
                          <li>Playmaker / dynamic guard</li>
                      </ul>
                  </section>
                  
                  <section>
                      <h2>Contact</h2>
                      <p>📧 vladgeorgescu123@gmail.com</p>
                      <p>📱 +40 757 330 375</p>
                      <p><strong>Represented by:</strong> Heinrich Sports Management (Austria) - FIBA Agent Licence 2016504733</p>
                  </section>
              </div>
          </body>
          </html>
          EOF

      - name: Commit and push files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Generate portfolio files" || echo "No changes to commit"
          git push
